<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ગુજરાતી ઓટોકમ્પ્લીટ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b2430; --muted:#6b7684; --line:#d5dbe3; --accent:#1f4fd8; --bg:#f4f6f9; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans Gujarati", system-ui, sans-serif; display:flex;
         flex-direction:column; align-items:center; padding:12vh 16px 32px; }
  h1 { font-size:2rem; margin:0 0 6px; font-weight:600; }
  p.sub { margin:0 0 28px; color:var(--muted); max-width:52ch; text-align:center; line-height:1.6; }
  .wrap { position:relative; width:min(640px, 100%); }
  input { width:100%; font:inherit; font-size:1.2rem; padding:14px 20px; border:1px solid var(--line);
          border-radius:28px; background:#fff; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,79,216,.15); }
  ul { list-style:none; margin:6px 0 0; padding:6px 0; position:absolute; left:0; right:0;
       background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden;
       box-shadow:0 8px 24px rgba(20,30,50,.10); }
  li { display:flex; justify-content:space-between; align-items:center; gap:12px;
       padding:10px 20px; font-size:1.1rem; cursor:pointer; }
  li.on, li:hover { background:#eef2fb; }
  li b { font-weight:600; color:var(--accent); }
  li .txt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { font-size:.75rem; color:var(--muted); flex:none; }
  .hint { margin-top:24px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
  <h1>ગુજરાતી ઓટોકમ્પ્લીટ</h1>
  <p class="sub">લખવાનું શરૂ કરો. ટ્રાઇગ્રામ, બાઇગ્રામ અને યુનિગ્રામ મૉડલ આગળનો શબ્દ સૂચવશે.</p>
  <div class="wrap">
    <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus
           placeholder="ગુજરાતીમાં લખો, જેમ કે: મારું">
    <ul id="suggestions" hidden></ul>
  </div>
  <p class="hint">↑ ↓ થી પસંદ કરો, Tab અથવા Enter થી સ્વીકારો, Esc થી બંધ કરો.</p>
  <script src="model.js"></script>
  <script src="autocomplete.js"></script>
</body>
</html>
